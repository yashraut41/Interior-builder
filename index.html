<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat Walkthrough</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>

  <div id="ui">
    <button id="back-btn" class="hidden">&larr; Dollhouse view</button>
    <button id="export-btn" title="three.js JSON for the three.js editor (File &rarr; Import)">Export flat.json</button>
    <div id="room-label" class="hidden"></div>
    <div id="hint">Press H for controls</div>
  </div>

  <div id="hotspot-tip" class="hidden"></div>

  <div id="controls-help">
    <button id="help-toggle" aria-expanded="false" aria-controls="help-body">Controls <kbd>H</kbd></button>
    <div id="help-body"></div>
  </div>

  <div id="splash" class="hidden" role="dialog" aria-modal="true" aria-labelledby="splash-title">
    <div class="splash-card">
      <h2 id="splash-title">Flat walkthrough</h2>
      <p class="splash-sub">Plan Option 1 &middot; 940 sq.ft</p>
      <div id="splash-controls"></div>
      <button id="splash-start">Start</button>
      <p class="splash-note">Press <kbd>H</kbd> any time to see these again.</p>
    </div>
  </div>

  <div id="panels">
    <div id="paint-panel" class="panel">
      <div class="panel-title">Wall colour</div>
      <select id="paint-room" aria-label="Room"></select>
      <div class="panel-row">
        <input type="color" id="paint-color" aria-label="Wall colour" />
        <code id="paint-hex" title="Paste into this room's finish.wall in roomData.js"></code>
        <button id="paint-reset" title="Back to the colour in roomData.js">Reset</button>
      </div>
    </div>

    <div id="theme-panel" class="panel">
      <div class="panel-title">Kitchen theme</div>
      <div id="theme-swatches" role="radiogroup" aria-label="Kitchen theme"></div>
      <div id="theme-name"></div>
    </div>

    <div id="door-panel" class="panel hidden">
      <button id="door-btn">Open utility door</button>
    </div>

    <div id="sun-panel" class="panel">
      <label class="panel-title"><input type="checkbox" id="sun-on" /> Sun</label>
      <div id="sun-controls" class="hidden">
        <div class="panel-row">
          <input type="date" id="sun-date" aria-label="Date" />
          <button id="sun-play" title="Run the clock">&#9654;</button>
        </div>
        <input type="range" id="sun-time" min="0" max="1439" step="5" aria-label="Time of day" />
        <div id="sun-readout"></div>
        <div class="panel-row">
          <label for="sun-north" title="True compass bearing that up-the-sheet faces. Paste into PLAN_UP_BEARING in roomData.js once confirmed.">Plan up</label>
          <input type="number" id="sun-north" min="-180" max="360" step="1" />°
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
