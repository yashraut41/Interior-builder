<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat Walkthrough</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>

  <div id="ui">
    <button id="back-btn" class="hidden">&larr; Dollhouse view</button>
    <button id="export-btn" title="three.js JSON for the three.js editor (File &rarr; Import)">Export flat.json</button>
    <div id="room-label" class="hidden"></div>
    <div id="hint">Click a hotspot to walk in. Drag to look around.</div>
  </div>

  <div id="paint-panel">
    <div class="panel-title">Wall colour</div>
    <select id="paint-room" aria-label="Room"></select>
    <div class="paint-row">
      <input type="color" id="paint-color" aria-label="Wall colour" />
      <code id="paint-hex" title="Paste into this room's finish.wall in roomData.js"></code>
      <button id="paint-reset" title="Back to the colour in roomData.js">Reset</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
